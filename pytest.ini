[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = session
filterwarnings =
    ignore::DeprecationWarning
    # pydantic's deprecation warning class isn't importable by pytest's
    # filter parser on some setups; match by message instead.
    ignore:.*PydanticDeprecatedSince20.*:DeprecationWarning
    # Ignore specific deprecation message from Python's `crypt` module used by passlib
    ignore:.*crypt is deprecated.*:DeprecationWarning